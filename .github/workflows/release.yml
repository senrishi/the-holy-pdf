name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup App Directory
        run: |
          chmod +x ./build_app.sh

      - name: Build Application Bundle
        run: |
          ./build_app.sh

      - name: Create DMG Installer
        run: |
          mkdir -p dmg_staging
          cp -R /Applications/TheHolyPdf.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "TheHolyPdf" -srcfolder dmg_staging -ov -format UDZO TheHolyPdf-Installer.dmg
          rm -rf dmg_staging

      - name: Create Release Archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent /Applications/TheHolyPdf.app TheHolyPdf-macOS.zip

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: |
            TheHolyPdf-Installer.dmg
            TheHolyPdf-macOS.zip
          name: TheHolyPdf ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
